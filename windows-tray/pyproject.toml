[project]
name = "agent-quota-tray"
version = "1.0.0"
description = "Windows system tray for Agent Quota – shows API usage at a glance"
requires-python = ">=3.11"
dependencies = [
    "pystray>=0.19",
    "Pillow>=10.0",
    "requests>=2.28",
]

[project.gui-scripts]
agent-quota = "agent_quota_tray:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_quota_tray"]
